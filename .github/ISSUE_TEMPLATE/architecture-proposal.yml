name: Architecture proposal
description: Evidence-bounded architecture proposal request
title: "[WP-XX.Y] "
labels: ["architecture-review", "evidence-required"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private evidence, precise routes, or unsupported scientific claims."
  - type: input
    id: parent
    attributes:
      label: Parent work package
      placeholder: WP-XX
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
      placeholder: "- [ ] Criterion with evidence"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and stop conditions
    validations:
      required: true
